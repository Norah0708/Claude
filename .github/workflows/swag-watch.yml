# Claude 周边补货监控：补货时任务失败并触发 GitHub 邮件通知。
# GitHub 对 schedule 节流严重（实测数小时才触发一次），所以定时运行在任务内部
# 每5分钟循环检查约5.7小时；下一次定时运行会排队接力。push/手动运行只检查一次。
name: swag-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/swag-watch.yml

permissions: {}

concurrency:
  group: swag-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LOOP_MINUTES: ${{ github.event_name == 'schedule' && '340' || '0' }}
    steps:
      - name: Check swag status
        shell: bash
        run: |
          set -u
          url="https://claude.dev/terminal/swag-status.json"
          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while :; do
            if body=$(curl -fsS -m 20 --retry 3 --retry-delay 5 -A "Mozilla/5.0 swag-watch" "$url"); then
              echo "$(date -u +%H:%M:%S) 返回内容: $body"
              off=$(printf '%s' "$body" | jq -c '.off // empty' 2>/dev/null || true)
              if [ -n "$off" ] \
                 && printf '%s' "$off" | jq -e 'type=="array" and index("plushie")!=null and index("stickers")!=null' >/dev/null; then
                echo "仍已领完"
              else
                open=""
                printf '%s' "$off" | jq -e 'type=="array" and index("plushie")!=null' >/dev/null 2>&1 || open="$open 毛绒玩具(plushie)"
                printf '%s' "$off" | jq -e 'type=="array" and index("stickers")!=null' >/dev/null 2>&1 || open="$open 贴纸(stickers)"
                echo "::error title=Claude 周边可能补货了::开放项目:${open}。立刻用手机打开 https://claude.dev/terminal/ 输入 /plushies 或 /stickers 登记"
                exit 1
              fi
            else
              echo "$(date -u +%H:%M:%S) 读取失败，本次跳过（不算补货）"
            fi
            [ $(( $(date +%s) + 300 )) -lt "$deadline" ] || exit 0
            sleep 300
          done
